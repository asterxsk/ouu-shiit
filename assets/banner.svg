<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="ouu-shiit — GPU effects and scroll layers for the web">
  <title>ouu-shiit</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0B13"/>
      <stop offset="0.5" stop-color="#0C0A1B"/>
      <stop offset="1" stop-color="#06070C"/>
    </linearGradient>

    <radialGradient id="blobViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#7C5CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#25D8EE" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="#25D8EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#25D8EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A5C" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#FF8A5C" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FF8A5C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#EDE9FF"/>
      <stop offset="1" stop-color="#9FC0FF"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#7C5CFF" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#25D8EE" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FF8A5C" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.035"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.085"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.055"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.20"/>
    </linearGradient>

    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.1" cy="1.1" r="1.1" fill="#FFFFFF" opacity="0.05"/>
    </pattern>

    <clipPath id="frame">
      <rect x="0" y="0" width="1280" height="400" rx="0"/>
    </clipPath>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#dots)"/>

    <g filter="url(#soft)">
      <ellipse cx="196" cy="96" rx="260" ry="188" fill="url(#blobViolet)"/>
      <ellipse cx="1044" cy="330" rx="300" ry="200" fill="url(#blobCyan)"/>
      <ellipse cx="676" cy="26" rx="250" ry="150" fill="url(#blobAmber)"/>
    </g>

    <!-- refraction pane -->
    <rect x="44" y="40" width="1192" height="320" rx="26" fill="url(#glass)"/>
    <rect x="44" y="40" width="1192" height="320" rx="26" fill="none" stroke="url(#edge)" stroke-width="1.25"/>
    <path d="M70 40.7h1140" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="1.25" stroke-linecap="round"/>

    <!-- mark -->
    <g transform="translate(104 108)">
      <rect x="0" y="0" width="52" height="52" rx="15" fill="#0B0D18" fill-opacity="0.55"/>
      <rect x="0.75" y="0.75" width="50.5" height="50.5" rx="14.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
      <circle cx="26" cy="26" r="13.5" fill="none" stroke="#7C5CFF" stroke-width="2.4" stroke-opacity="0.95"/>
      <circle cx="26" cy="26" r="7.5" fill="none" stroke="#25D8EE" stroke-width="2.4" stroke-opacity="0.9"/>
      <circle cx="19.5" cy="19.5" r="2.6" fill="#FFFFFF" fill-opacity="0.85"/>
    </g>

    <text x="180" y="122" class="mono" font-size="15" letter-spacing="4.6" fill="#9AA3C7">SKILL FOR CLAUDE CODE</text>

    <text x="180" y="212" class="sans" font-size="82" font-weight="600" letter-spacing="-2.4" fill="url(#word)">ouu-shiit</text>

    <rect x="180" y="238" width="300" height="3" rx="1.5" fill="url(#rule)"/>

    <text x="180" y="286" class="sans" font-size="21" fill="#C3C9E0">GPU effects and scroll layers for the web —</text>
    <text x="180" y="316" class="sans" font-size="21" fill="#8E96B4">built to ship, measured, and switched off cleanly.</text>

    <!-- chips -->
    <g class="mono" font-size="13.5">
      <g transform="translate(848 124)">
        <rect x="0" y="0" width="190" height="34" rx="17" fill="url(#chip)" stroke="url(#edge)" stroke-width="1"/>
        <circle cx="21" cy="17" r="3.4" fill="#7C5CFF"/>
        <text x="36" y="22" fill="#D5DAEA">react-three-fiber</text>
      </g>
      <g transform="translate(848 170)">
        <rect x="0" y="0" width="190" height="34" rx="17" fill="url(#chip)" stroke="url(#edge)" stroke-width="1"/>
        <circle cx="21" cy="17" r="3.4" fill="#25D8EE"/>
        <text x="36" y="22" fill="#D5DAEA">Spline</text>
      </g>
      <g transform="translate(848 216)">
        <rect x="0" y="0" width="190" height="34" rx="17" fill="url(#chip)" stroke="url(#edge)" stroke-width="1"/>
        <circle cx="21" cy="17" r="3.4" fill="#FF8A5C"/>
        <text x="36" y="22" fill="#D5DAEA">liquid glass</text>
      </g>
      <g transform="translate(848 262)">
        <rect x="0" y="0" width="190" height="34" rx="17" fill="url(#chip)" stroke="url(#edge)" stroke-width="1"/>
        <circle cx="21" cy="17" r="3.4" fill="#A78BFA"/>
        <text x="36" y="22" fill="#D5DAEA">ShaderGradient</text>
      </g>

      <g transform="translate(1054 124)">
        <rect x="0" y="0" width="138" height="34" rx="17" fill="url(#chip)" stroke="url(#edge)" stroke-width="1"/>
        <circle cx="21" cy="17" r="3.4" fill="#F0ABFC"/>
        <text x="36" y="22" fill="#D5DAEA">liquid-logo</text>
      </g>
      <g transform="translate(1054 170)">
        <rect x="0" y="0" width="138" height="34" rx="17" fill="url(#chip)" stroke="url(#edge)" stroke-width="1"/>
        <circle cx="21" cy="17" r="3.4" fill="#34D399"/>
        <text x="36" y="22" fill="#D5DAEA">Lenis</text>
      </g>
      <g transform="translate(1054 216)">
        <rect x="0" y="0" width="138" height="34" rx="17" fill="url(#chip)" stroke="url(#edge)" stroke-width="1"/>
        <circle cx="21" cy="17" r="3.4" fill="#FBBF24"/>
        <text x="36" y="22" fill="#D5DAEA">StringTune</text>
      </g>
    </g>
  </g>
</svg>
